services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - livekit-net

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
    networks:
      - livekit-net

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    volumes:
      - ./egress.yaml:/egress.yaml
    environment:
      - EGRESS_CONFIG_FILE=/egress.yaml
    depends_on:
      - redis
      - livekit
    networks:
      - livekit-net

  buddy-agent:
    image: ${ECR_REPOSITORY_URL:-buddy-agent:latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - livekit-net

networks:
  livekit-net:
    driver: bridge